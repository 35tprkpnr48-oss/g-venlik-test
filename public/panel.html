
<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapor Paneli</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }
    body {
      margin: 0;
      padding: 18px;
      background: #0b1220;
      color: #eef3ff;
    }
    main { max-width: 1000px; margin: auto; }
    .top, .card, .login {
      margin-bottom: 14px;
      padding: 16px;
      background: #121d31;
      border: 1px solid #293853;
      border-radius: 16px;
    }
    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 1.5rem; }
    h2 { margin: 0 0 12px; font-size: 1.1rem; }
    input {
      box-sizing: border-box;
      width: 100%;
      margin: 8px 0;
      padding: 12px;
      border: 1px solid #52627d;
      border-radius: 10px;
      background: #0b1220;
      color: white;
    }
    button {
      padding: 11px 14px;
      border: 0;
      border-radius: 10px;
      background: #6aa6ff;
      color: #081326;
      font-weight: 800;
    }
    .muted { color: #aab8cf; font-size: .9rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 8px;
    }
    .item {
      padding: 10px;
      border-radius: 10px;
      background: #0b1220;
      overflow-wrap: anywhere;
    }
    .label { color: #9fb0ca; font-size: .78rem; }
    .value { margin-top: 4px; }
    #status { margin: 10px 0; }
    .empty { padding: 24px; text-align: center; color: #aab8cf; }
  </style>
</head>
<body>
<main>
  <div class="top">
    <h1>Son Test Raporları</h1>
    <span class="muted">En yeni raporlar üstte · 15 saniyede bir yenilenir</span>
  </div>

  <section class="login" id="login">
    <label for="password">Panel parolası</label>
    <input id="password" type="password"
           autocomplete="current-password"
           placeholder="Render PANEL_PASSWORD">
    <button id="open">Raporları göster</button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
  <section id="reports"></section>
</main>

<script>
(() => {
  const passwordInput = document.getElementById("password");
  const openButton = document.getElementById("open");
  const status = document.getElementById("status");
  const reportsEl = document.getElementById("reports");

  let password = "";
  let timer = null;

  // Sunucudan gelen metinlerin HTML olarak çalışmasını önle.
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));
  }

  function field(label, value) {
    return `
      <div class="item">
        <div class="label">${esc(label)}</div>
        <div class="value">${esc(value || "Bilinmiyor")}</div>
      </div>`;
  }

  function render(reports) {
    if (!reports.length) {
      reportsEl.innerHTML =
        '<div class="card empty">Henüz rapor yok.</div>';
      return;
    }

    reportsEl.innerHTML = reports.map(report => {
      const location = report.approximateLocation
        ? [
            report.approximateLocation.city,
            report.approximateLocation.region,
            report.approximateLocation.country
          ].filter(Boolean).join(", ")
        : "Konum bulunamadı";

      const tests = (report.tests || []).map(test =>
        `${esc(test.name)}: ${esc(test.result)}`
      ).join("<br>") || "Test sonucu yok";

      const date = new Date(report.receivedAt).toLocaleString();

      return `
        <article class="card">
          <h2>
            ${esc(report.username)}
            <span class="muted">· ${esc(date)}</span>
          </h2>

          <div class="grid">
            ${field("IP adresi", report.ip)}
            ${field("IP tabanlı yaklaşık konum", location)}
            ${field("Platform", report.platform)}
            ${field("Tarayıcı", report.userAgent)}
            ${field("Dil", report.language)}
            ${field("Saat dilimi", report.timezone)}
            ${field(
              "Ekran boyutu",
              report.screen
                ? `${report.screen.width} × ${report.screen.height}`
                : ""
            )}
            ${field(
              "Sayfa boyutu",
              report.viewport
                ? `${report.viewport.width} × ${report.viewport.height}`
                : ""
            )}
            ${field(
              "Bağlantı",
              report.online ? "Çevrimiçi" : "Çevrimdışı"
            )}
            <div class="item">
              <div class="label">Test sonuçları</div>
              <div class="value">${tests}</div>
            </div>
          </div>
        </article>`;
    }).join("");
  }

  async function refresh() {
    try {
      const response = await fetch("/api/reports", {
        headers: { "x-panel-password": password },
        cache: "no-store"
      });

      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.error || "Raporlar alınamadı.");
      }

      status.textContent = `Toplam ${data.reports.length} rapor`;
      render(data.reports);
    } catch (error) {
      status.textContent = error.message;

      if (timer) clearInterval(timer);
      timer = null;
    }
  }

  openButton.addEventListener("click", () => {
    password = passwordInput.value;

    if (!password) {
      status.textContent = "Panel parolasını gir.";
      return;
    }

    document.getElementById("login").style.display = "none";
    refresh();
    timer = setInterval(refresh, 15000);
  });

  passwordInput.addEventListener("keydown", event => {
    if (event.key === "Enter") openButton.click();
  });
})();
</script>
</body>
</html>
