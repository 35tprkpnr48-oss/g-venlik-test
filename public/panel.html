<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapor Paneli</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
    body{margin:0;background:#0b1220;color:#eef3ff;padding:18px}
    main{max-width:1000px;margin:auto}
    .top,.card,.login{background:#121d31;border:1px solid #293853;border-radius:16px;padding:16px;margin-bottom:14px}
    .top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    h1{font-size:1.5rem;margin:0} h2{font-size:1.1rem;margin:0 0 12px}
    input{box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #52627d;background:#0b1220;color:white;width:100%;margin:8px 0}
    button{padding:11px 14px;border:0;border-radius:10px;background:#6aa6ff;color:#081326;font-weight:800}
    .muted{color:#aab8cf;font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
    .item{background:#0b1220;border-radius:10px;padding:10px;overflow-wrap:anywhere}
    .label{font-size:.78rem;color:#9fb0ca}.value{margin-top:4px}
    #status{white-space:pre-wrap;margin:10px 0}.empty{padding:24px;text-align:center;color:#aab8cf}
  </style>
</head>
<body>
<main>
  <div class="top"><h1>Son Test Raporları</h1><span class="muted">En yeni raporlar üstte · 15 saniyede bir yenilenir</span></div>
  <section class="login" id="login">
    <label for="password">Panel parolası</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="Render PANEL_PASSWORD">
    <button id="open">Raporları göster</button>
    <p class="muted">Parola bu tarayıcı sekmesinde kullanılır; URL'ye eklenmez.</p>
  </section>
  <div id="status" role="status" aria-live="polite"></div>
  <section id="reports"></section>
</main>
<script>
(() => {
  const passwordInput = document.getElementById('password');
  const openButton = document.getElementById('open');
  const status = document.getElementById('status');
  const reportsEl = document.getElementById('reports');
  let password = '';
  let timer = null;

  const esc = value => String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));

  function field(label, value) {
    return `<div class="item"><div class="label">${esc(label)}</div><div class="value">${esc(value || 'Bilinmiyor')}</div></div>`;
  }
  function render(reports) {
    if (!reports.length) {
      reportsEl.innerHTML = '<div class="card empty">Henüz rapor yok.</div>';
      return;
    }
    reportsEl.innerHTML = reports.map(r => {
      const loc = r.approximateLocation
        ? [r.approximateLocation.city, r.approximateLocation.region, r.approximateLocation.country].filter(Boolean).join(', ')
        : 'Konum bulunamadı';
      const tests = (r.tests || []).map(t => `${esc(t.name)}: ${esc(t.result)}`).join('<br>') || 'Test sonucu yok';
      return `<article class="card">
        <h2>${esc(r.username)} <span class="muted">· ${esc(new Date(r.receivedAt).toLocaleString())}</span></h2>
        <div class="grid">
          ${field('IP adresi', r.ip)}
          ${field('IP tabanlı yaklaşık konum', loc)}
          ${field('Platform', r.platform)}
          ${field('Tarayıcı', r.userAgent)}
          ${field('Dil', r.language)}
          ${field('Saat dilimi', r.timezone)}
          ${field('Ekran boyutu', r.screen ? `${r.screen.width} × ${r.screen.height}` : '')}
          ${field('Sayfa boyutu', r.viewport ? `${r.viewport.width} × ${r.viewport.height}` : '')}
          ${field('Bağlantı', r.online ? 'Çevrimiçi' : 'Çevrimdışı')}
          <div class="item"><div class="label">Test sonuçları</div><div class="value">${tests}</div></div>
        </div>
      </article>`;
    }).join('');
  }
  async function refresh() {
    try {
      const response = await fetch('/api/reports', {headers:{'x-panel-password':password}, cache:'no-store'});
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Raporlar alınamadı.');
      status.textContent = `Toplam ${data.reports.length} rapor`;
      render(data.reports);
    } catch (e) {
      status.textContent = e.message;
      if (timer) clearInterval(timer);
      timer = null;
    }
  }
  openButton.addEventListener('click', () => {
    password = passwordInput.value;
    if (!password) { status.textContent = 'Panel parolasını gir.'; return; }
    document.getElementById('login').style.display = 'none';
    refresh();
    timer = setInterval(refresh, 15000);
  });
  passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') openButton.click(); });
})();
</script>
</body>
</html>
