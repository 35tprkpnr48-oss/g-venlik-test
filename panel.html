<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Rapor Paneli</title><style>:root{color-scheme:dark;--bg:#0b1020;--card:#131c31;--line:#293650;--text:#edf3ff;--muted:#9eacc5;--blue:#6ea8fe}*{box-sizing:border-box}body{margin:0;padding:20px;background:var(--bg);color:var(--text);font:14px system-ui}.wrap{max-width:1000px;margin:auto}header{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}button,a.btn{border:0;border-radius:10px;background:#263754;color:white;padding:10px 14px;text-decoration:none;font:inherit;cursor:pointer}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);margin:14px 0}.report{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:16px;margin:12px 0}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.name{font-size:18px;font-weight:750}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin-top:12px}.item{background:#0d1527;border-radius:9px;padding:10px;overflow-wrap:anywhere}.item b{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}.detail{margin-top:10px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#d7e3fa}#status{color:var(--muted)}</style></head><body><main class="wrap"><header><div><h1>Mobil rapor paneli</h1><div class="muted">Gönderilmiş test raporları</div></div><div class="actions"><button id="refresh">Yenile</button><a class="btn" href="/api/export">JSON indir</a></div></header><input id="search" class="search" placeholder="Kullanıcı adı, IP veya şehirde ara"><div id="status">Raporlar yükleniyor…</div><section id="list"></section></main><script>let reports=[];const esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function item(label,value){return `<div class="item"><b>${esc(label)}</b>${esc(value)}</div>`}function render(){const q=document.getElementById('search').value.toLowerCase();const rows=reports.filter(r=>JSON.stringify([r.username,r.ipAddress,r.location,r.id]).toLowerCase().includes(q));document.getElementById('status').textContent=`${rows.length} rapor gösteriliyor`;document.getElementById('list').innerHTML=rows.map(r=>`<article class="report"><div class="top"><div class="name">${esc(r.username)}</div><div class="muted">${esc(new Date(r.receivedAt).toLocaleString())}</div></div><div class="grid">${item('Rapor numarası',r.id)}${item('IP adresi',r.ipAddress)}${item('Yaklaşık konum',r.location?[r.location.city,r.location.region,r.location.country].filter(Boolean).join(', '):'Bulunamadı')}${item('Tarayıcı',r.diagnostics?.userAgent)}${item('Platform',r.diagnostics?.platform)}${item('Dil / saat dilimi',[r.diagnostics?.language,r.diagnostics?.timezone].filter(Boolean).join(' / '))}${item('Ekran',r.diagnostics?.screen?`${r.diagnostics.screen.width} × ${r.diagnostics.screen.height}`:'—')}${item('Bağlantı',r.diagnostics?.online?'Çevrimiçi':r.diagnostics?.online===false?'Çevrimdışı':'—')}</div><details class="detail"><summary>Diğer teknik ayrıntılar</summary><pre>${esc(JSON.stringify(r.diagnostics,null,2))}</pre></details></article>`).join('')||'<p class="muted">Eşleşen rapor yok.</p>'}async function load(){document.getElementById('status').textContent='Raporlar yükleniyor…';try{const r=await fetch('/api/reports');if(!r.ok)throw new Error('Panel oturumu açılamadı.');reports=await r.json();render()}catch(e){document.getElementById('status').textContent=e.message+' Sayfayı /panel adresinden aç ve panel kullanıcı adı/şifresiyle giriş yap.'}}document.getElementById('refresh').onclick=load;document.getElementById('search').oninput=render;load();</script></body></html>
